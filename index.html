
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRONIX | Gestión de Horarios</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px 25px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        p {
            color: #b9c4d5;
            line-height: 1.7;
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #e879b9;
            color: #101827;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        a:hover {
            background: #f4a6d1;
        }

        footer {
            margin-top: 60px;
            color: #8190a5;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>CRONIX</h1>

        <p>
            Plataforma de gestión y organización de horarios
            escolares. Una herramienta diseñada para facilitar
            el trabajo de coordinadores y docentes.
        </p>

        <a href="https://github.com/Ramirez57N/CRONIX">
            Conocer el proyecto
        </a>

        <footer>
            CRONIX © 2026
            <br>
            Gestión inteligente de horarios escolares
        </footer>
    </main>
</body>
</html>
